<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Analytics | Bank Loan Predictor</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
<script
    src="{{ url_for('static', filename='theme.js') }}"
    defer
>
</script>

</head>

<body>

<!-- ================================================= -->
<!-- NAVBAR -->
<!-- ================================================= -->

<nav class="navbar">

    <div class="nav-brand">
        🏦 Bank Loan Predictor
    </div>

    <!-- Mobile Menu Button -->
    <button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
    >
        ☰
    </button>

    <!-- Navigation Links -->
    <div class="nav-links" id="navLinks">

        <a href="{{ url_for('home') }}">
            🏠 Home
        </a>

        <a href="{{ url_for('dashboard') }}">
            📊 Dashboard
        </a>

        <a href="{{ url_for('history') }}?status=all">
            📋 History
        </a>

        <a
            href="{{ url_for('analytics') }}"
            class="active"
        >
            📈 Analytics
        </a>

        <a href="{{ url_for('export_page') }}">
            📥 Export
        </a>

        <a href="{{ url_for('admin_login') }}">
            🔐 Admin
        </a>

        <!-- Light / Dark Theme -->
        <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
        >
            🌙 Dark
        </button>

    </div>

</nav>

<!-- ================================================= -->
<!-- MAIN CONTAINER -->
<!-- ================================================= -->

<div class="result-container">

<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<div class="result-header">

    <div class="result-logo">
        📈
    </div>


    <h1>
        Loan Analytics
    </h1>


    <p>
        Approved and rejected loan application analysis
    </p>

</div>



<!-- ================================================= -->
<!-- APPLICATION OVERVIEW -->
<!-- ================================================= -->

<div class="chart-card">

    <div class="chart-header">

        <h2>
            📊 Application Overview
        </h2>


        <p>
            All approved vs rejected applications
        </p>

    </div>


    <div class="chart-container">

        <canvas id="overviewChart"></canvas>

    </div>

</div>



<!-- ================================================= -->
<!-- LAST 7 DAYS -->
<!-- ================================================= -->

<div class="chart-card">

    <div class="chart-header">

        <h2>
            📅 Application Analytics
        </h2>


        <p>
            Approved vs Rejected applications - Last 7 Days
        </p>

    </div>


    <div class="chart-container">

        <canvas id="analyticsChart"></canvas>

    </div>

</div>

</div>

<!-- ================================================= -->
<!-- CHART.JS -->
<!-- ================================================= -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>


/* ================================================= */
/* TOTAL APPLICATION OVERVIEW */
/* ================================================= */

/*
   IMPORTANT:
   हे counts पूर्ण MongoDB database मधून येतात.
   Last 7 Days data वापरायचा नाही.
*/

const approvedCount =
    Number(
        {{ approved_count | default(0, true) | tojson }}
    );


const rejectedCount =
    Number(
        {{ rejected_count | default(0, true) | tojson }}
    );



/* ================================================= */
/* LAST 7 DAYS DATA */
/* ================================================= */

const analyticsLabels =
    {{ analytics_labels | default([], true) | tojson }};


const analyticsApproved =
    {{ analytics_approved | default([], true) | tojson }};


const analyticsRejected =
    {{ analytics_rejected | default([], true) | tojson }};



/* ================================================= */
/* DEBUG */
/* ================================================= */

console.log(
    "Total Approved:",
    approvedCount
);

console.log(
    "Total Rejected:",
    rejectedCount
);

console.log(
    "Last 7 Days Approved:",
    analyticsApproved
);

console.log(
    "Last 7 Days Rejected:",
    analyticsRejected
);



/* ================================================= */
/* APPLICATION OVERVIEW DOUGHNUT CHART */
/* ================================================= */

const overviewCanvas =
    document.getElementById(
        "overviewChart"
    );


if (overviewCanvas) {

    new Chart(

        overviewCanvas,

        {

            type: "doughnut",


            data: {

                labels: [

                    "Approved",

                    "Rejected"

                ],


                datasets: [

                    {

                        data: [

                            approvedCount,

                            rejectedCount

                        ],


                        backgroundColor: [

                            "#16a34a",

                            "#dc2626"

                        ],


                        borderWidth: 0

                    }

                ]

            },


            options: {

                responsive: true,

                maintainAspectRatio: false,


                plugins: {

                    legend: {

                        position: "bottom"

                    }

                }

            }

        }

    );

}



/* ================================================= */
/* LAST 7 DAYS LINE CHART */
/* ================================================= */

const analyticsCanvas =
    document.getElementById(
        "analyticsChart"
    );


if (
    analyticsCanvas &&
    analyticsLabels.length > 0
) {

    new Chart(

        analyticsCanvas,

        {

            type: "line",


            data: {

                labels:
                    analyticsLabels,


                datasets: [

                    {

                        label:
                            "Approved",


                        data:
                            analyticsApproved,


                        borderColor:
                            "#16a34a",


                        backgroundColor:
                            "rgba(22, 163, 74, 0.10)",


                        borderWidth: 3,


                        pointRadius: 5,


                        pointHoverRadius: 7,


                        tension: 0.35,


                        fill: true

                    },


                    {

                        label:
                            "Rejected",


                        data:
                            analyticsRejected,


                        borderColor:
                            "#dc2626",


                        backgroundColor:
                            "rgba(220, 38, 38, 0.08)",


                        borderWidth: 3,


                        pointRadius: 5,


                        pointHoverRadius: 7,


                        tension: 0.35,


                        fill: true

                    }

                ]

            },


            options: {

                responsive: true,

                maintainAspectRatio: false,


                interaction: {

                    mode: "index",

                    intersect: false

                },


                plugins: {

                    legend: {

                        position: "bottom"

                    }

                },


                scales: {

                    y: {

                        beginAtZero: true,


                        ticks: {

                            precision: 0

                        }

                    }

                }

            }

        }

    );

}


</script>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Bank Loan Predictor</title>


<script
    src="{{ url_for('static', filename='theme.js') }}"
    defer
>
</script>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: linear-gradient(
            135deg,
            #eef2ff,
            #dbeafe
        );

        color: #1e293b;
    }

    .login-container {
        width: 100%;
        max-width: 420px;

        background: white;

        padding: 40px 35px;

        border-radius: 20px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.12);
    }

    .login-logo {
        width: 70px;
        height: 70px;

        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #2563eb;

        color: white;

        border-radius: 18px;

        font-size: 32px;
    }

    h1 {
        text-align: center;

        color: #1e3a8a;

        font-size: 27px;

        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;

        color: #64748b;

        font-size: 13px;

        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;

        margin-bottom: 7px;

        font-size: 13px;

        font-weight: 600;

        color: #334155;
    }

    input {
        width: 100%;

        padding: 13px 14px;

        border: 1px solid #cbd5e1;

        border-radius: 10px;

        background: #f8fafc;

        font-size: 14px;

        color: #1e293b;

        outline: none;

        transition: 0.25s ease;
    }

    input:focus {
        border-color: #2563eb;

        background: white;

        box-shadow:
            0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .login-button {
        width: 100%;

        padding: 14px;

        margin-top: 5px;

        border: none;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s ease;
    }

    .login-button:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .error-message {
        margin-bottom: 18px;

        padding: 12px;

        border-radius: 9px;

        background: #fee2e2;

        color: #dc2626;

        text-align: center;

        font-size: 13px;

        font-weight: 600;
    }

    .back-link {
        display: block;

        margin-top: 22px;

        text-align: center;

        color: #2563eb;

        text-decoration: none;

        font-size: 13px;

        font-weight: 600;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    @media (max-width: 500px) {

        .login-container {
            padding: 30px 22px;
        }

        h1 {
            font-size: 24px;
        }
    }
</style>

</head>

<body>

<div class="login-container">

    <div class="login-logo">
        🔐
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Bank Loan Predictor Administration
    </p>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

        <input
            type="password"
            name="password"
            id="adminPassword"
            placeholder="Enter password"
            required
        >

        <button
            type="button"
            id="togglePassword"
            class="password-toggle"
        >
            👁️
        </button>

    </div>

    <script>
        const togglePassword = document.getElementById("togglePassword");
        const password = document.getElementById("adminPassword");

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {
                password.type = "text";
                togglePassword.textContent = "🙈";
            } else {
                password.type = "password";
                togglePassword.textContent = "👁️";
            }

        });
    </script>
        </div>


        <button
            type="submit"
            class="login-button"
        >
            🔑 Login
        </button>

    </form>


    <a
        href="/"
        class="back-link"
    >
        ← Back to Home
    </a>

</div>
</body>

</html>
